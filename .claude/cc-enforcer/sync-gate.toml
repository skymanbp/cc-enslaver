# cc-enforcer — repo-wide sync gate (rule 12)
#
# Co-update groups for THIS repo. Semantics of one group: if any file
# edited during a session matches a `when` glob, then at least one edited
# file must match a `require` glob — otherwise Stop layer (i) blocks the
# done-claim, unless the reply carries an explicit sync marker
# (`同步核对:` / `sync-check:`) explaining why the require side needs no
# change.
#
# Globs are matched with fnmatch against PROJECT-RELATIVE paths, and `*`
# crosses path separators (so "rules/*.md" also covers "rules/zh/").
#
#   mode = "any"  (default) — one require-side edit satisfies the group.
#   mode = "all"            — EVERY require glob needs an edited match.
#                             Use for lock-step invariants where one stale
#                             sibling is the failure mode.
#
# Run `/cc-enforcer:sync-gate check` after editing: a glob that matches
# nothing is silently inert, and this config is failing-open by design.
#
# [[groups]]
# name = "rules-fanout"
# when = ["rules/*.md"]
# require = ["docs/RULES.md", "prompts/*.md"]
# note = "Editing a rule fans out to the index and the injected prompts."

[[groups]]
name = "rules-fanout"
when = ["rules/*.md"]
require = ["prompts/*.md", "docs/RULES.md", "commands/checklist.md"]
note = "Editing a rule fans out to at least one of: injected prompts / docs/RULES.md index / checklist. Full co-update map: docs/ARCHITECTURE.md §8 — the gate is a floor, not the ceiling."

[[groups]]
name = "hooks-tests"
when = ["hooks/scripts/*.py"]
require = ["tests/*.py"]
note = "Every hook-script change needs its black-box test file re-checked (ARCHITECTURE.md §8)."

[[groups]]
name = "version-manifests"
when = [".claude-plugin/plugin.json"]
require = [".claude-plugin/marketplace.json", "CHANGELOG.md"]
mode = "all"
note = "plugin.json is the version authority; BOTH marketplace.json AND CHANGELOG must move with it (§4.1 — updating only one of them is exactly the v0.22.1 shipping failure)."

[[groups]]
name = "guards-readme"
when = ["hooks/scripts/*_guard.py"]
require = ["README*.md"]
note = "A guard script's user-visible behaviour is enumerated in both READMEs (the PreToolUse gate table and the nine-layer Stop table). v0.35.1: the layer-(b) hedge set was described in three README places that no sweep covered, because v0.34.1 scoped the same fix to prompts/ only. Widened from stop_guard to all three *_guard.py by the same argument. The gate is a floor: answering with a sync-check line is the intended escape when a change is not user-visible."
